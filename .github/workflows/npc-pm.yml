name: NPC PM
on:
  repository_dispatch:
    types: [npc-pm]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: npc-pm-issue-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  pm:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'npc-pm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/npc-agent
        with:
          app-id: ${{ secrets.NPC_PM_APP_ID }}
          private-key: ${{ secrets.NPC_PM_PRIVATE_KEY }}
          role-slug: npc-pm
          role-prompt: .github/npc/roles/pm.md
          allowed-tools: "Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(cd:*),Bash(timeout:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(sed:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(pwd:*),Bash(echo:*),Bash(test:*),Bash(nohup:*),Bash(kill:*),Bash(sleep:*),Bash(bash:*),Bash(sh:*),Bash(env:*),Bash(export:*),Read,Write,Edit,Glob,Grep"
          issue-number: ${{ github.event.issue.number || github.event.client_payload.issue }}
          trigger-comment: ${{ format('NPC report for issue {0}', github.event.client_payload.issue) }}
          branch: ${{ github.event.client_payload.branch || format('ai-npcs/issue-{0}', github.event.issue.number) }}
          ensure-branch-pr: "true"
          gate: "true"
          gate-mode: "write"
          runtime: ${{ vars.NPC_RUNTIME || 'claude' }}
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          copilot-model: ${{ vars.COPILOT_MODEL }}
          copilot-output-format: ${{ vars.COPILOT_OUTPUT_FORMAT }}
          github-host: ${{ vars.NPC_GITHUB_HOST }}
          copilot-budget-premium-requests: ${{ vars.COPILOT_BUDGET_PREMIUM_REQUESTS }}
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-auth-token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic-base-url: ${{ secrets.ANTHROPIC_BASE_URL }}
          anthropic-model: ${{ secrets.ANTHROPIC_MODEL }}
          anthropic-default-opus-model: ${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          anthropic-default-sonnet-model: ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          anthropic-default-haiku-model: ${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
      - name: Upload NPC timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-timing-${{ github.run_id }}
          path: npc-timing.json
          if-no-files-found: ignore
