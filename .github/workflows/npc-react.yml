name: NPC React
on:
  repository_dispatch:
    types: [npc-react]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: npc-react-issue-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  react:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'npc-react'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || format('ai-npcs/issue-{0}', github.event.issue.number) }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.m2
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-npc-${{ hashFiles('**/package-lock.json', '**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-npc-
      - uses: ./.github/actions/npc-agent
        with:
          app-id: ${{ secrets.NPC_REACT_APP_ID }}
          private-key: ${{ secrets.NPC_REACT_PRIVATE_KEY }}
          role-slug: npc-react
          role-prompt: .github/npc/roles/react.md
          allowed-tools: "Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(cd:*),Bash(timeout:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(sed:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(pwd:*),Bash(echo:*),Bash(test:*),Bash(nohup:*),Bash(kill:*),Bash(sleep:*),Bash(bash:*),Bash(sh:*),Bash(env:*),Bash(export:*),Read,Write,Edit,Glob,Grep"
          issue-number: ${{ github.event.issue.number || github.event.client_payload.issue }}
          trigger-comment: ${{ format('NPC report for issue {0}', github.event.client_payload.issue) }}
          branch: ${{ github.event.client_payload.branch || format('ai-npcs/issue-{0}', github.event.issue.number) }}
          ensure-branch-pr: "false"
          gate: "true"
          gate-mode: "write"
          prepare-env: "true"
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-auth-token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic-base-url: ${{ secrets.ANTHROPIC_BASE_URL }}
          anthropic-model: ${{ secrets.ANTHROPIC_MODEL }}
          anthropic-default-opus-model: ${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          anthropic-default-sonnet-model: ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          anthropic-default-haiku-model: ${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
