name: NPC QA
on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [npc-qa]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: npc-issue-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  qa:
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.user.type == 'User' && contains(github.event.comment.body, '@npc-qa')) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'npc-qa')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || format('ai-npcs/issue-{0}', github.event.issue.number) }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Playwright
        shell: bash
        run: npx playwright install --with-deps
      - uses: ./.github/actions/npc-agent
        with:
          app-id: ${{ secrets.NPC_QA_APP_ID }}
          private-key: ${{ secrets.NPC_QA_PRIVATE_KEY }}
          role-slug: npc-qa
          role-prompt: .github/npc/roles/qa.md
          allowed-tools: "Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(mvn:*),Bash(java:*),Bash(curl:*),Bash(ls:*),Read,Write,Edit,Glob,Grep"
          issue-number: ${{ github.event.issue.number || github.event.client_payload.issue }}
          trigger-comment: ${{ github.event.comment.body || format('NPC report for issue {0}', github.event.client_payload.issue) }}
          branch: ${{ github.event.client_payload.branch || format('ai-npcs/issue-{0}', github.event.issue.number) }}
          ensure-branch-pr: "false"
          gate: "true"
          gate-mode: ${{ github.event_name == 'repository_dispatch' && 'write' || 'start' }}
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-auth-token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic-base-url: ${{ secrets.ANTHROPIC_BASE_URL }}
          anthropic-model: ${{ secrets.ANTHROPIC_MODEL }}
          anthropic-default-opus-model: ${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          anthropic-default-sonnet-model: ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          anthropic-default-haiku-model: ${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
