name: NPC QA
on:
  repository_dispatch:
    types: [npc-qa]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: npc-qa-issue-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  qa:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'npc-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || format('ai-npcs/issue-{0}', github.event.issue.number) }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Pre-install project dependencies
        shell: bash
        run: |
          if [ -f backend/pom.xml ]; then (cd backend && timeout 600 mvn -q -DskipTests dependency:go-offline) || echo "backend preinstall skipped"; fi
          if [ -f frontend/package-lock.json ]; then (cd frontend && timeout 600 npm ci) || echo "frontend preinstall skipped"; fi
          if [ -f tests/visitor-e2e/package-lock.json ]; then (cd tests/visitor-e2e && timeout 600 npm ci) || echo "e2e preinstall skipped"; fi
      - name: Install Playwright
        shell: bash
        run: npx playwright install --with-deps
      - uses: ./.github/actions/npc-agent
        with:
          app-id: ${{ secrets.NPC_QA_APP_ID }}
          private-key: ${{ secrets.NPC_QA_PRIVATE_KEY }}
          role-slug: npc-qa
          role-prompt: .github/npc/roles/qa.md
          allowed-tools: "Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(mvn:*),Bash(java:*),Bash(curl:*),Bash(cd:*),Bash(timeout:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(sed:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(pwd:*),Bash(echo:*),Bash(test:*),Bash(nohup:*),Bash(kill:*),Bash(sleep:*),Bash(bash:*),Bash(sh:*),Bash(env:*),Bash(export:*),Read,Write,Edit,Glob,Grep"
          issue-number: ${{ github.event.issue.number || github.event.client_payload.issue }}
          trigger-comment: ${{ format('NPC report for issue {0}', github.event.client_payload.issue) }}
          branch: ${{ github.event.client_payload.branch || format('ai-npcs/issue-{0}', github.event.issue.number) }}
          ensure-branch-pr: "false"
          gate: "true"
          gate-mode: "write"
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-auth-token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic-base-url: ${{ secrets.ANTHROPIC_BASE_URL }}
          anthropic-model: ${{ secrets.ANTHROPIC_MODEL }}
          anthropic-default-opus-model: ${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          anthropic-default-sonnet-model: ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          anthropic-default-haiku-model: ${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
