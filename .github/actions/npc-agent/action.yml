name: NPC Agent
description: Run one NPC role with its GitHub App identity.

inputs:
  app-id:
    description: GitHub App ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  role-slug:
    description: Role slug, also used as the App slug
    required: true
  role-prompt:
    description: Path to the role prompt
    required: true
  allowed-tools:
    description: Comma-separated allowed tools for Claude Code
    required: true
  issue-number:
    description: Issue number
    required: true
  trigger-comment:
    description: The comment that triggered this run
    required: false
  branch:
    description: Issue working branch
    required: true
  ensure-branch-pr:
    description: Create the Issue branch and draft PR if missing
    required: false
    default: "false"
  claude-token:
    description: CLAUDE_CODE_OAUTH_TOKEN (optional if using ANTHROPIC_AUTH_TOKEN)
    required: false
    default: ""
  runtime:
    description: "Agent runtime: claude or copilot"
    required: false
    default: "claude"
  copilot-token:
    description: COPILOT_GITHUB_TOKEN for GitHub Copilot CLI
    required: false
    default: ""
  copilot-model:
    description: Copilot model name (default claude-sonnet-4.5)
    required: false
    default: ""
  github-host:
    description: GitHub hostname for GHE.com, for example bmw.ghe.com
    required: false
    default: ""
  copilot-budget-premium-requests:
    description: Premium request budget for one run
    required: false
    default: ""
  copilot-output-format:
    description: Copilot CLI output format (text or json)
    required: false
    default: ""
  anthropic-auth-token:
    description: ANTHROPIC_AUTH_TOKEN
    required: false
    default: ""
  anthropic-base-url:
    description: ANTHROPIC_BASE_URL
    required: false
    default: ""
  anthropic-model:
    description: ANTHROPIC_MODEL
    required: false
    default: ""
  anthropic-default-opus-model:
    description: ANTHROPIC_DEFAULT_OPUS_MODEL
    required: false
    default: ""
  anthropic-default-sonnet-model:
    description: ANTHROPIC_DEFAULT_SONNET_MODEL
    required: false
    default: ""
  anthropic-default-haiku-model:
    description: ANTHROPIC_DEFAULT_HAIKU_MODEL
    required: false
    default: ""
  gate:
    description: Check the start/write gate before running
    required: false
    default: "false"
  gate-mode:
    description: start or write
    required: false
    default: "start"
  prepare-env:
    description: Install detected project dependencies
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install Claude Code
      if: inputs.runtime != 'copilot'
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Install Copilot CLI
      if: inputs.runtime == 'copilot'
      shell: bash
      run: npm install -g @github/copilot

    - name: Configure git and gh
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_HOST: ${{ inputs.github-host }}
        APP_ID: ${{ inputs.app-id }}
        ROLE_SLUG: ${{ inputs.role-slug }}
      run: |
        gh auth setup-git
        git config user.name "${ROLE_SLUG}[bot]"
        git config user.email "${APP_ID}+${ROLE_SLUG}[bot]@users.noreply.github.com"

    - name: Check start gate
      if: inputs.gate == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_HOST: ${{ inputs.github-host }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        COMMENT_BODY: ${{ github.event.comment.body || '' }}
        AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
        ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        GATE_MODE: ${{ inputs.gate-mode }}
        ROLE_SLUG: ${{ inputs.role-slug }}
      run: |
        if [ -z "$ISSUE_LABELS" ]; then
          ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | paste -sd, -)
          export ISSUE_LABELS
        fi
        set +e
        if [ "$GATE_MODE" = "write" ]; then
          RESULT=$(node scripts/gate.mjs --write)
        else
          RESULT=$(node scripts/gate.mjs)
        fi
        STATUS=$?
        echo "$RESULT"
        if [ $STATUS -ne 0 ]; then
          gh issue comment "$ISSUE_NUMBER" --body "AI NPC 启动被拒：需要仓库 Owner/Member/Collaborator 添加 \`npc-work-mode\` 标签，并在正文段落中 @${ROLE_SLUG}。"
          exit 1
        fi

    - name: Ensure Issue branch and draft PR
      if: inputs.ensure-branch-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_HOST: ${{ inputs.github-host }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        BRANCH: ${{ inputs.branch }}
        BASE_BRANCH: main
      run: node scripts/ensure-branch-pr.mjs

    - name: Prepare project dependencies
      if: inputs.prepare-env == 'true'
      shell: bash
      run: node scripts/prepare-env.mjs

    - name: Run NPC agent
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_HOST: ${{ inputs.github-host }}
        GIT_EDITOR: "true"
        GIT_TERMINAL_PROMPT: "0"
        CI: "true"
        NO_COLOR: "1"
        npm_config_yes: "true"
        NPC_RUNTIME: ${{ inputs.runtime }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-token }}
        COPILOT_MODEL: ${{ inputs.copilot-model || 'claude-sonnet-4.5' }}
        COPILOT_OUTPUT_FORMAT: ${{ inputs.copilot-output-format }}
        COPILOT_BUDGET_PREMIUM_REQUESTS: ${{ inputs.copilot-budget-premium-requests || '250' }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic-auth-token }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic-model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.anthropic-default-opus-model }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.anthropic-default-sonnet-model }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.anthropic-default-haiku-model }}
        ROLE_SLUG: ${{ inputs.role-slug }}
        ROLE_PROMPT: ${{ inputs.role-prompt }}
        ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        TRIGGER_COMMENT: ${{ inputs.trigger-comment }}
        BRANCH: ${{ inputs.branch }}
      run: node scripts/run-agent.mjs
